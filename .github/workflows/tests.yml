
name: Robot Tests and Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t robotics-devops .

      - name: Run tests inside Docker
        run: docker run --rm --entrypoint python robotics-devops -m unittest discover -s tests -v
